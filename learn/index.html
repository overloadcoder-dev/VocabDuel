<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Learn English Vocabulary with Chinese Explanations | VocabDuel</title>
    <meta name="description" content="Explore English words with pronunciation, detailed Chinese explanations, definitions, examples, collocations and related vocabulary.">
    <meta name="theme-color" content="#6757e8"><link rel="canonical" href="https://vocabduel.example/learn/">
    <meta property="og:type" content="website"><meta property="og:site_name" content="VocabDuel"><meta property="og:title" content="Learn English Vocabulary | VocabDuel"><meta property="og:description" content="Study useful English words deeply with Chinese explanations and examples."><meta property="og:url" content="https://vocabduel.example/learn/"><meta property="og:image" content="https://vocabduel.example/social-card.svg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://vocabduel.example/social-card.svg"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main-content" class="page-wrap py-8 sm:py-12">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="eyebrow">Word library</p><h1 class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">Learn a word deeply</h1><p class="mt-2 text-muted">从含义、发音到真实语境，一步步掌握每个单词。</p></div><div class="learn-top-actions flex gap-2"><button id="weak-practice" class="button button-quiet" type="button">⚡ Practice weak words <span id="weak-count" class="rounded-full bg-white px-2 py-0.5 text-xs">0</span></button><button id="progress-button" class="icon-button" type="button" aria-label="View local progress">◎</button></div></div>
      <button id="filter-toggle" class="button button-secondary mt-6 w-full sm:hidden" type="button" aria-expanded="false" aria-controls="vocabulary-filters">Show filters</button>
      <section id="vocabulary-filters" aria-label="Vocabulary filters" class="learn-filters mt-3 grid gap-3 rounded-2xl border border-black/5 bg-white p-4 sm:mt-7 sm:grid-cols-[10rem_13rem_auto]" data-collapsed>
        <label><span class="mb-1.5 block text-xs font-bold text-muted">Level</span><select id="level-filter" class="field"><option value="all">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option></select></label>
        <label><span class="mb-1.5 block text-xs font-bold text-muted">Category</span><select id="category-filter" class="field"><option value="all">All categories</option></select></label>
        <button id="random-word" class="button button-secondary self-end">↝ Random</button>
      </section>
      <div id="empty-state" class="glass-card mt-6 hidden p-10 text-center"><p class="text-3xl" aria-hidden="true">⌕</p><h2 class="mt-3 text-xl font-extrabold">No words found</h2><p class="mt-2 text-muted">Try another level or category.</p><button id="clear-filters" class="button button-secondary mt-5">Clear filters</button></div>
      <article id="word-card" class="glass-card mt-6 overflow-hidden" aria-labelledby="word-term">
        <div class="border-b border-black/5 p-5 sm:p-8"><div class="flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between"><div><div class="flex flex-wrap items-center gap-2"><span id="word-level" class="tag"></span><span id="word-cefr" class="tag"></span></div><div class="learn-word-controls mt-4 flex flex-wrap items-center gap-3"><h2 id="word-term" class="text-4xl font-black tracking-tight sm:text-5xl" tabindex="-1"></h2><button id="speak-word" class="button button-secondary" type="button" aria-label="Play pronunciation at the selected speed"><span aria-hidden="true">🔊</span> Listen</button><label class="pronunciation-speed"><span class="sr-only">Pronunciation speed</span><select id="pronunciation-speed" class="field" aria-label="Pronunciation speed"><option value="0.5">0.5× Slow</option><option value="0.75">0.75× Relaxed</option><option value="1" selected>1× Normal</option><option value="1.25">1.25× Fast</option></select></label></div><p id="word-ipa" class="mt-2 text-lg text-muted"></p><p id="word-pos" class="mt-2 text-sm font-bold uppercase tracking-wider text-brand"></p></div><div class="learn-status-actions flex gap-2"><button id="difficult-word" class="button button-secondary" type="button" aria-pressed="false">☆ Difficult</button><button id="learned-word" class="button button-secondary" type="button" aria-pressed="false">✓ Learned</button></div></div><p id="word-short" class="mt-7 text-2xl font-extrabold"></p></div>
        <div class="grid gap-7 p-6 sm:p-8 lg:grid-cols-2">
          <section><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">中文详解</h3><p id="word-explanation" class="mt-3 text-lg leading-8"></p></section>
          <section><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">English definition</h3><p id="word-definition" class="mt-3 text-lg leading-8"></p></section>
          <section class="rounded-2xl bg-brand-soft/65 p-5 lg:col-span-2"><h3 class="text-sm font-extrabold uppercase tracking-wider text-brand-dark">In context</h3><blockquote id="word-example" class="mt-3 text-xl font-bold leading-8"></blockquote><p id="word-example-cn" class="mt-2 leading-7 text-muted"></p></section>
          <section><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">Common combinations</h3><div id="word-collocations" class="mt-3 flex flex-wrap gap-2"></div></section>
          <section class="grid grid-cols-2 gap-5"><div><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">Similar</h3><div id="word-synonyms" class="mt-3 flex flex-wrap gap-2"></div></div><div><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">Opposite</h3><div id="word-antonyms" class="mt-3 flex flex-wrap gap-2"></div></div></section>
          <section class="lg:col-span-2"><h3 class="text-sm font-extrabold uppercase tracking-wider text-muted">Categories</h3><div id="word-categories" class="mt-3 flex flex-wrap gap-2"></div></section>
        </div>
        <div class="learn-actions flex flex-wrap items-center justify-between gap-3 border-t border-black/5 bg-slate-50 p-4 sm:px-8"><button id="previous-word" class="button button-secondary" type="button">← Prev</button><span id="word-position" class="text-sm font-bold text-muted" aria-live="polite"></span><div class="flex gap-2"><a id="practice-word" href="/play/" class="button button-primary">Practice</a><button id="next-word" class="button button-secondary" type="button">Next →</button></div></div>
      </article>
    </main><div id="site-footer"></div><script type="module" src="/src/pages/learn.ts"></script>
  </body>
</html>
